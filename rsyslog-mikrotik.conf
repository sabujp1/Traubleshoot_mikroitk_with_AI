# /etc/rsyslog.d/10-mikrotik.conf
#
# Receives MikroTik syslog on UDP 1514 and writes to a log file.
# Promtail tails this file and forwards to Loki.
#
# NOTE: Docker must NOT map port 1514 — rsyslog owns it on the host.

module(load="imudp")
input(type="imudp" port="1514" ruleset="mikrotik")

template(name="MikrotikFile" type="string"
  string="%TIMESTAMP% %FROMHOST% %syslogtag%%msg%\n")

ruleset(name="mikrotik") {
    action(
        type="omfile"
        file="/var/log/mikrotik/routers.log"
        template="MikrotikFile"
        fileCreateMode="0644"
        dirCreateMode="0755"
        createDirs="on"
    )
    stop
}
