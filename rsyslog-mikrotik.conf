# /etc/rsyslog.d/mikrotik.conf
# Receives MikroTik syslog (RFC3164/BSD) on UDP port 1514
# and writes to a dedicated log file for Promtail to tail.

# Load UDP module
module(load="imudp")
input(type="imudp" port="1514")

# Custom log template — one line per message, standard syslog format
template(name="MikrotikFormat" type="string"
  string="%TIMESTAMP% %HOSTNAME% %syslogtag%%msg%\n")

# Write all local0 facility logs (MikroTik uses local0) to file
# MikroTik router hostname will be in HOSTNAME field
if $syslogfacility-text == 'local0' then {
    action(type="omfile"
           file="/var/log/mikrotik/routers.log"
           template="MikrotikFormat"
           fileCreateMode="0644"
           dirCreateMode="0755"
           createDirs="on")
    stop
}

# Catch-all: any syslog from port 1514 that doesn't match local0
# (in case MikroTik uses a different facility)
if $inputname == 'imudp' then {
    action(type="omfile"
           file="/var/log/mikrotik/routers.log"
           template="MikrotikFormat"
           fileCreateMode="0644"
           dirCreateMode="0755"
           createDirs="on")
    stop
}
