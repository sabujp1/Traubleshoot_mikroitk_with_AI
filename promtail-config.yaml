server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: mikrotik
    syslog:
      listen_address: 0.0.0.0:1514
      idle_timeout: 60s
      label_structured_data: yes
      format: rfc3164
      labels:
        job: "mikrotik_logs"
    relabel_configs:
      - source_labels: ['__syslog_message_hostname']
        target_label: 'host'
      - source_labels: ['__syslog_message_app_name']
        target_label: 'module'

    pipeline_stages:
      - regex:
          # This handles the "topic,topic message" format common in MikroTik
          expression: '^(?P<tags>[^ ]+) (?P<content>.*)$'
      - labels:
          tags:
      # Optional: Extract firewall actions if the tag is firewall
      - match:
          selector: '{tags=~".*firewall.*"}'
          stages:
            - regex:
                expression: '(?P<action>drop|accept|reject) (?P<chain>input|forward|output) (?P<interface_in>[^ ]+) (?P<interface_out>[^ ]+) proto (?P<proto>[^ ]+), (?P<src_ip>[^:]+):(?P<src_port>\d+)->(?P<dst_ip>[^:]+):(?P<dst_port>\d+)'
            - labels:
                action:
                src_ip:
                dst_ip:
                      proto:
