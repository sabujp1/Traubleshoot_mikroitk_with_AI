server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: mikrotik_syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: "mikrotik_logs"
          __path__: /var/log/mikrotik/routers.log

    pipeline_stages:
      # Parse the rsyslog-written line:
      # "Apr 29 17:25:00 103.159.188.61 bgp-peer-1: {l_addr: ...} message"
      - regex:
          expression: '^(?P<ts>\w{3}\s+\d+\s+[\d:]+)\s+(?P<host>\S+)\s+(?P<app>[^:]+):\s*(?P<message>.+)$'
      - labels:
          host:
          app:
